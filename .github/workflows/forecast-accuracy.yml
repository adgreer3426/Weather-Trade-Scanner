name: Forecast accuracy refresh

# Weekly: fetch the latest forecasts and NWS climate reports, recompute the
# rolling 180-day accuracy stats the scanner's "Hist acc" column reads, and
# commit data/ so the scheduled scans pick them up.
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC (before the 7am Central scan)
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the whole window instead of updating incrementally"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update forecast accuracy
        run: python forecast_accuracy.py ${{ inputs.full && '--full' || '' }}

      - name: Commit updated data
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update forecast accuracy data"
          git push
