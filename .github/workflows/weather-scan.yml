name: Weather ladder scan

# Runs 7am, 12pm and 5pm US Central and emails the results.
# GitHub cron is UTC-only, so both the daylight-time (CDT) and standard-time
# (CST) UTC hours are scheduled; the "Check Central time" step skips whichever
# set doesn't match the current season. Keying off the triggering cron string
# (rather than the clock) keeps this correct even when GitHub starts a run late.
on:
  schedule:
    - cron: "0 12,17,22 * * *"   # 7am/12pm/5pm CDT
    - cron: "0 13,18,23 * * *"   # 7am/12pm/5pm CST
  workflow_dispatch:              # "Run workflow" button for manual runs

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Central time
        id: gate
        run: |
          zone=$(TZ=America/Chicago date +%Z)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$zone" = "CDT" ] && [ "${{ github.event.schedule }}" != "0 12,17,22 * * *" ]; then run=false; fi
            if [ "$zone" = "CST" ] && [ "${{ github.event.schedule }}" != "0 13,18,23 * * *" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run scanner
        if: steps.gate.outputs.run == 'true'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
        run: |
          key_file="$RUNNER_TEMP/kalshi_private_key.pem"
          printf '%s\n' "$KALSHI_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          export KALSHI_PRIVATE_KEY_PATH="$key_file"
          set +e
          python kalshi_weather_ladder_scanner.py --csv results.csv > scan.txt 2> scan.log
          echo $? > exit_code
          rm -f "$key_file"

      - name: Email results
        if: steps.gate.outputs.run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python .github/scripts/email_results.py

      - name: Fail if scanner failed
        if: steps.gate.outputs.run == 'true'
        run: test "$(cat exit_code)" = "0"
